<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<!-- converting wire frame diagram into html-->
<body> 
<div class="game">
   <!-- sidebar boxes -->
        <aside class="sidebar">

    <div class="box">
        <p>Score to beat</p>
        <span class="value" id="score-to-beat">0</span>
    </div>

    <div class="box">
        <p>Time</p>
        <span class="value" id="time">0.0</span>
    </div>

     <div class="box">
        <p>Current Multiplier</p>
        <span class="value" id="multiplier">1x</span>
    </div>

     
     <div class="box tall">
        <p>Round Stats</p>
        <p class="stat-line">Round: <span id="stat-round">1</span></p>
        <p class="stat-line">Bet: <span id="stat-bet">0</span></p>
        <p class="stat-line">Last score: <span id="stat-last">0</span></p>
    </div>

    <div class="box tall">
        <p>Lifetime Stats</p>
        <p class="stat-line">Rounds cleared: <span id="stat-cleared">0</span></p>
        <p class="stat-line">Hands played: <span id="stat-hands">0</span></p>
        <p class="stat-line">Best score: <span id="stat-best">0</span></p>
    </div>



    <button class="box" id="btn-settings">Settings</button>

    </aside>

    <!-- topbar boxes -->
    <header class="topbar">

    <input type="text" id="bet-amount" value="10">
        <div id="status-message"></div>

    <div class="box">
        <p>Money</p>
        <span class="value" id="money">0</span>
    </div>

    <a href="#shop" class="box">Shop</a>

    </header>


    <!-- play area -->
    <main class="play-area" id="play-area">
        Play Area
    </main>


    <!-- actions that players can do -->
    <footer class="actions">
        <button class="box" id="btn-deal">Deal</button>
        <button class="box" id="btn-hit">Hit</button>
        <button class="box" id="btn-split">Split</button>
        <button class="box" id="btn-stand">Stand</button>
        <button class="box" id="btn-fold">Fold</button>
    </footer>

    </div>

        <!-- shop popup -->
        <div class="shop" id="shop">
        <div class="shop-window">

        <div class="shop-top">
            <a href="#" class="box">Exit Shop</a>
                <div class="box">
                    <p>Money</p>
                    <span class="value" id="shop-money">0</span>
                </div>
            </div>

         <div class="shop-grid">
            <div class="shop-column">
                <h2 class="box">Multipliers</h2>
                    <button class="box">2x</button>
                    <button class="box">4x</button>
                    <button class="box">10x</button>
                    <button class="box">20x</button>
                </div>

                <div class="shop-column">
                    <h2 class="box">Cheats</h2>
                        <button class="box">See Next Card</button>
                        <button class="box">Safety Net</button>
                        <button class="box">Pause Time</button>
                        <button class="box">Edit Card Value</button>
                </div>

                <div class="shop-column">
                    <h2 class="box">Card Shenanigans</h2>
                    <button class="box">Add Ace to Deck</button>
                    <button class="box">Refresh Deck</button>
                    
                </div>
            </div>
  
            <!-- physical button for when round ends, score/title comes from main.js -->  
                <div class="modal hidden" id="result-modal">
            <div class="modal-window">
            <h2 id="result-title"></h2>
            <p id="result-desc"></p>
            <button class="box" id="btn-continue">Continue</button>
            <button class="box" id="btn-end-run">End Run</button>
        </div>
    </div>

    <!-- hidden until the run ends, main.js sets the final stats -->
    <div class="modal hidden" id="end-modal">
        <div class="modal-window">
            <h2 id="end-title"></h2>
            <p id="end-message"></p>
            <p id="end-summary"></p>
            <button class="box" id="btn-new-run">New Run</button>
        </div>
    </div>


        </div>
    </div>
    <script src="../js/main.js"></script>
    <script src="../js/ui.js"></script>
</body>
</html>
